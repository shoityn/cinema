version: "3.9"

services:
  backend:
    build: ./backend
    container_name: cinema-backend
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000